name: Convert ICS & Create PRs

on:
  push:
    branches:
      - master
    paths:
      - "data/holidays/ics/**" # Trigger workflow when changes are pushed to 'ics' directory
  workflow_dispatch:

jobs:
  convert-and-create-pr:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/github.txt

      - name: Check and Convert
        run: |
          for file in data/holidays/ics/*.ics; do
            year=$(basename "$file" .ics)
            # Skip master calendar
            if [ "$year" = "srilanka-holidays" ]; then continue; fi
            branch_name="src-files-$year"

            # git config
            git config --global user.email "77499497+NimuthuGanegoda@users.noreply.github.com"
            git config --global user.name "nimuthuganegoda"

            # Checkout branch
            git checkout master
            git checkout -b "$branch_name"

            # Track if changes are made
            changes_made=false
            
            # CSV Conversion - always regenerate to keep in sync
            python src/converters/icalendar_to_csv.py "$file"
            if ! git diff --quiet -- data/holidays/csv/$year.csv; then
              git add "data/holidays/csv/$year.csv"
              git commit -m "Convert $year.ics to $year.csv [skip ci]"
              git push -u origin "$branch_name"
              changes_made=true
            else
              echo "CSV file for $year.ics is up to date."
            fi
            
            # XML Conversion - always regenerate
            python src/converters/icalendar_to_xml.py "$file"
            if ! git diff --quiet -- data/holidays/xml/$year.xml; then
              git add "data/holidays/xml/$year.xml"
              git commit -m "Convert $year.ics to $year.xml [skip ci]"
              git push origin "$branch_name"
              changes_made=true
            else
              echo "XML file for $year.ics is up to date."
            fi
            
            # JSON Conversion - always regenerate
            python src/converters/icalendar_to_json.py "$file"
            if ! git diff --quiet -- data/holidays/json/$year.json; then
              git add "data/holidays/json/$year.json"
              git commit -m "Convert $year.ics to $year.json [skip ci]"
              git push origin "$branch_name"
              changes_made=true
            else
              echo "JSON file for $year.ics is up to date."
            fi

            # Only create PR if changes were made
            if [ "$changes_made" = true ]; then
              gh pr create --title "Add source files for year $year" --body "[Automated PR] This PR contains the changes after converting $year.ics to CSV, XML & JSON formats" --base master --head "$branch_name" --label "automerge"
            else
              echo "No changes detected for $year. Skipping PR creation."
            fi
            
          done
