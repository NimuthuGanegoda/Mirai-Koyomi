name: Real-Time Holiday Sync

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  push:
    branches:
      - master
    paths:
      - "data/holidays/ics/20*.ics"
      - "src/converters/**"
  workflow_dispatch:

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/github.txt

      - name: Sync from Official Sources
        run: python src/converters/sync_holidays.py

      - name: Generate ICS files from JSON
        run: |
          # Use a simple python snippet to generate ICS from updated JSON
          python3 -c '
          import json, os
          for year in range(2021, 2030):
              json_path = f"data/holidays/json/{year}.json"
              if os.path.exists(json_path):
                  with open(json_path) as f: holidays = json.load(f)
                  content = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NimuthuGanegoda//Sri Lanka Holidays//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Sri Lanka Holidays "+str(year), "X-WR-TIMEZONE:Asia/Colombo"]
                  for h in holidays:
                      uid = h["uid"] if "@" in h["uid"] else h["uid"]+"@srilanka-holidays.api"
                      content.extend(["BEGIN:VEVENT", f"UID:{uid}", f"DTSTART;VALUE=DATE:{h[\"start\"].replace(\"-\", \"\")}", f"DTEND;VALUE=DATE:{h[\"end\"].replace(\"-\", \"\")}", f"SUMMARY:{h[\"summary\"]}", "STATUS:CONFIRMED", "TRANSP:TRANSPARENT", "X-APPLE-TRAVEL-ADVISORY-BEHAVIOR:AUTOMATIC", "BEGIN:VALARM", "ACTION:AUDIO", "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT"])
                  content.append("END:VCALENDAR")
                  with open(f"data/holidays/ics/{year}.ics", "w") as f: f.write("\n".join(content))
          '

      - name: Run CSV/XML Converters
        run: |
          for year in {2021..2029}; do
            if [ -f "data/holidays/ics/$year.ics" ]; then
              python src/converters/icalendar_to_csv.py data/holidays/ics/$year.ics
              python src/converters/icalendar_to_xml.py data/holidays/ics/$year.ics
              python src/converters/icalendar_to_json.py data/holidays/ics/$year.ics
            fi
          done

      - name: Merge Master ICS
        run: python src/converters/merge_ics.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Real-time sync: Updated holiday data from official sources" && git push)
